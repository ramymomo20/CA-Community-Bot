name: CI

# Lives at the actual repo root (CA-Community-Bot/.github/workflows/) --
# a GitHub Actions workflow file only triggers from the exact repo-root
# .github/workflows/ path.
#
# The Hub (ioscahub.github.io) is its own independent repo with its own
# remote and its own CI/deploy workflows -- it is intentionally not built
# or tested here.

on:
  push:
    branches: [main]
    paths:
      - 'OfficialCABot/ios_bot/**'
      - 'OfficialCABot/tests/**'
      - 'OfficialCABot/requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'OfficialCABot/ios_bot/**'
      - 'OfficialCABot/tests/**'
      - 'OfficialCABot/requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OfficialCABot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Syntax-check every bot module
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          failed = []
          for path in Path("ios_bot").rglob("*.py"):
              try:
                  ast.parse(path.read_text(encoding="utf-8-sig"))
              except SyntaxError as e:
                  failed.append((path, e))
          for path, e in failed:
              print(f"::error file={path}::{e}")
          if failed:
              raise SystemExit(f"{len(failed)} file(s) failed to parse")
          print(f"Checked {sum(1 for _ in Path('ios_bot').rglob('*.py'))} files, all OK")
          PY
      - name: Run bot test suite
        run: python -m pytest tests/ -v
