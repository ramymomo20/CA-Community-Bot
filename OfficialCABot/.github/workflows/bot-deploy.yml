name: Bot Deploy

on:
  push:
    branches: [main]
    paths:
      - 'ios_bot/**'
      - 'ioscahub.github.io/backend/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'main.py'
      - 'parser_match.py'
      - 'requirements.txt'
      - '.github/workflows/bot-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SPARKED_SERVER_HOST: ${{ secrets.SPARKED_SERVER_HOST }}
      SPARKED_SERVER_PORT: ${{ secrets.SPARKED_SERVER_PORT }}
      SPARKED_SERVER_USERNAME: ${{ secrets.SPARKED_SERVER_USERNAME }}
      SPARKED_SERVER_PASSWORD: ${{ secrets.SPARKED_SERVER_PASSWORD }}
      SPARKED_SERVER_REMOTE_PATH: ${{ secrets.SPARKED_SERVER_REMOTE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in [
              Path("main.py"),
              Path("parser_match.py"),
              Path("ios_bot/tasks.py"),
              Path("ioscahub.github.io/backend/app/main.py"),
          ]:
              ast.parse(path.read_text(encoding="utf-8"))
              print(f"checked {path}")
          PY
      - run: |
          python scripts/deploy_bot_sftp.py \
            --host "$SPARKED_SERVER_HOST" \
            --port "${SPARKED_SERVER_PORT:-2022}" \
            --username "$SPARKED_SERVER_USERNAME" \
            --password "$SPARKED_SERVER_PASSWORD" \
            --remote-path "$SPARKED_SERVER_REMOTE_PATH"
